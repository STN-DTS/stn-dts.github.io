---
layout: default
---
<article class="page">
    <header>
        <p class="prompt">$ cat {{ page.url | remove_first: '/' | remove: '/' | default: 'index' }}.md</p>
        <h1 class="page-title">{{ page.title | escape }}</h1>
    </header>

    <div class="post-content">
        {{ content }}
    </div>
</article>
