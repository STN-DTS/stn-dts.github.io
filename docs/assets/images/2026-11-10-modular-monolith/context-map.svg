<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
  <title id="t">Context map</title>
  <desc id="d">The dashboard is a customer of profile, benefits and jobs and uses their published APIs in their own language. Jobs reaches profile and employment records through anti-corruption layers that translate into its own model. Profile also reads employment records. Each upstream module is an open host service: it publishes an api.ts.</desc>
