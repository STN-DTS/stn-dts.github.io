    .halo { paint-order: stroke; stroke: #12171e; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#10151c"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#f5c062" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#f5c062" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#2d3644" fill-opacity="0.55"/>
