<svg xmlns="http://www.w3.org/2000/svg" width="900" height="574" viewBox="0 0 900 574" role="img" aria-labelledby="t d">
  <title id="t">The jobs module as a hexagon</title>
  <desc id="d">The domain sits at the centre: plain values and functions. Around it, the application layer holds the use cases and the ports, which are Effect services. On the left, React Router route modules call feature functions that run use cases. On the right, adapters implement the ports: two in-memory stores and two anti-corruption layers over other modules' published APIs. At the top, the module's published API is consumed by the dashboard.</desc>
