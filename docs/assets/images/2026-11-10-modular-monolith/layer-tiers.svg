    <line x1="72" y1="420" x2="72" y2="152" stroke="#f5c062" stroke-width="1.6" marker-end="url(#aa)"/>
    <text transform="translate(64 280) rotate(-90)" font-size="11" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, Menlo, monospace"><tspan fill="#ffa657">Layer</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#d2a8ff">provideMerge</tspan><tspan fill="#e6edf3">(everything below)</tspan></text>
    <text x="400" y="444" font-size="11" fill="#8b96a5" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">tiers follow the module graph: a module's adapters can use any published service from a lower tier</text>
    <text x="400" y="460" font-size="11" fill="#a9b4c2" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">a service that no tier provides is a compile error, not a runtime surprise</text>
  </g>
</svg>
