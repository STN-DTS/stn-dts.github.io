<svg xmlns="http://www.w3.org/2000/svg" width="800" height="570" viewBox="0 0 800 570" role="img" aria-labelledby="t d">
  <title id="t">The composition root: every module's Layer, in tiers</title>
  <desc id="d">Module layers are stacked in five tiers. Independent modules (identity, benefits, employment records, payments) are at the bottom. Profile is above them, then jobs and employment insurance, then life events, then the dashboard at the top as the sink. Each tier is provided with everything below it using Layer.provideMerge. The result, AppLayer, is provided to the server layer, which NodeRuntime.runMain launches.</desc>
  <style>
    .halo { paint-order: stroke; stroke: #12171e; stroke-width: 5px; stroke-linejoin: round; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#10151c"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#f5c062" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#f5c062" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#2d3644" fill-opacity="0.55"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feFlood flood-color="#f5c062" flood-opacity="0.28"/>
      <feComposite in2="blur" operator="in" result="tint"/>
      <feMerge><feMergeNode in="tint"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5c062"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="799" height="569" rx="12" fill="url(#bg)" stroke="#2d3644"/>
  <rect x="0.5" y="0.5" width="799" height="569" rx="12" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="799" height="569" rx="12" fill="url(#spot)"/>
  <path d="M0.5,36 H799.5" stroke="#2d3644"/>
  <path d="M12.5,0.5 H787.5 A12,12 0 0 1 799.5,12.5 V36 H0.5 V12.5 A12,12 0 0 1 12.5,0.5 Z" fill="#0d1117" fill-opacity="0.55"/>
  <circle cx="22" cy="18" r="5" fill="#f85149" fill-opacity="0.85"/>
  <circle cx="40" cy="18" r="5" fill="#f5c062" fill-opacity="0.85"/>
  <circle cx="58" cy="18" r="5" fill="#3fb950" fill-opacity="0.85"/>
  <text x="400.0" y="22" font-size="11" fill="#8b96a5" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, Menlo, monospace">~/dts/diagrams/<tspan fill="#d0d7de">layer-tiers.svg</tspan></text>
  <text x="24" y="66" font-size="15" font-weight="700" fill="#e6edf3" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, Menlo, monospace"><tspan fill="#f5c062">## </tspan>The composition root: every module's Layer, in tiers</text>
  <g transform="translate(0 58)">
    <rect x="20" y="28" width="760" height="472" rx="12" fill="#0d1117"/><rect x="20" y="28" width="760" height="472" rx="12" fill="#39c5cf" fill-opacity="0.03" stroke="#39c5cf" stroke-opacity="0.9" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="36" y="52" font-size="12" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, Menlo, monospace" xml:space="preserve"><tspan fill="#ffa657">NodeRuntime</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#d2a8ff">runMain</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#ffa657">Layer</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#d2a8ff">launch</tspan><tspan fill="#e6edf3">(serverLayer))</tspan></text>
    <text x="764" y="52" font-size="11" fill="#56d4dd" text-anchor="end" font-weight="400" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">signals · graceful shutdown · finalizers</text>
    <rect x="36" y="64" width="728" height="420" rx="10" fill="#0d1117" filter="url(#shadow)"/><rect x="36" y="64" width="728" height="420" rx="10" fill="#39c5cf" fill-opacity="0.06" stroke="#39c5cf" stroke-opacity="0.9" stroke-width="1.4"/>
    <text x="52" y="86" font-size="11" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, Menlo, monospace" xml:space="preserve"><tspan fill="#e6edf3">serverLayer</tspan><tspan fill="#ff7b72"> = </tspan><tspan fill="#ffa657">HttpServer</tspan><tspan fill="#e6edf3">.</tspan><tspan fill="#d2a8ff">serve</tspan><tspan fill="#e6edf3">(app, middleware)</tspan><tspan fill="#ff7b72"> + </tspan><tspan fill="#ffa657">NodeHttpServer</tspan><tspan fill="#ff7b72"> + </tspan><tspan fill="#ffa657">Logging</tspan><tspan fill="#ff7b72"> + </tspan><tspan fill="#ffa657">Tracing</tspan></text>
    <rect x="52" y="98" width="696" height="372" rx="10" fill="#0d1117" filter="url(#glow)"/><rect x="52" y="98" width="696" height="372" rx="10" fill="#f5c062" fill-opacity="0.04" stroke="#f5c062" stroke-opacity="0.9" stroke-width="1.4"/>
    <text x="68" y="120" font-size="12.5" fill="#f5c062" text-anchor="start" font-weight="700" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, Menlo, monospace">AppLayer</text>
    <text x="732" y="120" font-size="11" fill="#a9b4c2" text-anchor="end" font-weight="400" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">built once, at boot · a failure stops the process</text>
    <rect x="255" y="136" width="290" height="36" rx="7" fill="#0d1117"/><rect x="255" y="136" width="290" height="36" rx="7" fill="#484f58" fill-opacity="0.09" stroke="#484f58" stroke-opacity="0.9" stroke-width="1.4" stroke-dasharray="4 3"/>
    <text x="400.0" y="159" font-size="11" fill="#8b96a5" text-anchor="middle" font-weight="400" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">demo control (seeds personas, outage switches)</text>
