    <rect x="258.2" y="383.0" width="72.8" height="22" rx="11.0" fill="#0d1117"/><rect x="258.2" y="383.0" width="72.8" height="22" rx="11.0" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.85"/>
    <text x="294.65" y="397.96" font-size="11" fill="#79c0ff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, Menlo, monospace">identity</text>
    <rect x="339.1" y="383.0" width="72.8" height="22" rx="11.0" fill="#0d1117"/><rect x="339.1" y="383.0" width="72.8" height="22" rx="11.0" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.85"/>
