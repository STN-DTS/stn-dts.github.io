    <text x="438.79999999999995" y="349.96" font-size="11" fill="#79c0ff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, Menlo, monospace">profile</text>
