    <rect x="359.4" y="191.0" width="152.0" height="22" rx="11.0" fill="#0d1117"/><rect x="359.4" y="191.0" width="152.0" height="22" rx="11.0" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.85"/>
    <text x="435.45" y="205.96" font-size="11" fill="#79c0ff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, Menlo, monospace">dashboard (the sink)</text>
    <rect x="215" y="232" width="370" height="36" rx="7" fill="#0d1117" filter="url(#shadow)"/><rect x="215" y="232" width="370" height="36" rx="7" fill="#8b96a5" fill-opacity="0.05" stroke="#8b96a5" stroke-opacity="0.9" stroke-width="1.4"/>
    <text x="227" y="255" font-size="11" fill="#a9b4c2" text-anchor="start" font-weight="400" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, Menlo, monospace">Events</text>
    <rect x="385.8" y="239.0" width="92.6" height="22" rx="11.0" fill="#0d1117"/><rect x="385.8" y="239.0" width="92.6" height="22" rx="11.0" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.85"/>
    <text x="432.1" y="253.96" font-size="11" fill="#79c0ff" text-anchor="middle" font-weight="600" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, Consolas, Menlo, monospace">life-events</text>
    <rect x="175" y="280" width="450" height="36" rx="7" fill="#0d1117" filter="url(#shadow)"/><rect x="175" y="280" width="450" height="36" rx="7" fill="#8b96a5" fill-opacity="0.05" stroke="#8b96a5" stroke-opacity="0.9" stroke-width="1.4"/>
