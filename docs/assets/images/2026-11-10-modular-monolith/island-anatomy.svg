<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="t d">
  <title id="t">The island: one page, two runtimes</title>
  <desc id="d">Inside one browser document on one origin, the host page is rendered by React Router on the server: the chrome, the side navigation, the language toggle and the RemoteOutlet. The island renders in the browser with Preact inside an open shadow root, which scopes styles only. Between them sits the mount contract, a package with no dependencies: the island calls navigate and getAccessToken on the host, and the host calls the island back through onLocationChange. Below the browser, the host server mints short-lived tokens and publishes its public keys; the island's own server serves its manifest, its entry and an API that verifies tokens against the host's keys.</desc>
