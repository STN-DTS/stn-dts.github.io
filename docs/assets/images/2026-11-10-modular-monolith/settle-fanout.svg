<svg xmlns="http://www.w3.org/2000/svg" width="800" height="444" viewBox="0 0 800 444" role="img" aria-labelledby="t d">
  <title id="t">settle: one slow or failing module never blanks the page</title>
  <desc id="d">The home page use case starts six parts concurrently. Each runs through settle with a 1.5 second timeout. Four finish and are ready. The claim part fails and the payments part runs past the timeout; both become unavailable and are logged. The page still renders, with those two cards showing an unavailable notice.</desc>
