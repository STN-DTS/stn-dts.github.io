<svg xmlns="http://www.w3.org/2000/svg" width="932" height="808" viewBox="0 0 932 808" role="img" aria-labelledby="t d">
  <title id="t">One request for /en/jobs, end to end</title>
  <desc id="d">A sequence diagram. The browser sends GET /en/jobs. The Effect HTTP server starts a server span, assigns a request id, logs the request and loads the session, then captures the request's whole Effect context and hands it to React Router inside the router context. React Router runs the account layout middleware, which signs the user in and checks consent, each through run(). The jobs loader calls loadJobs, which uses run() to execute the SearchJobs use case with CurrentUser added, inside a jobs.search span. The use case asks its ports for postings, the candidate and the shortlist, ranks them with pure domain code and maps the result to a plain DTO. React Router renders the page, and on the way out the Effect server commits the session cookie and adds the x-request-id header.</desc>
